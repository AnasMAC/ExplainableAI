spring.application.name=ingestion-service
server.port= 8081
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/employee-management/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/explainableAi


spring.datasource.url=jdbc:h2:mem:ingestiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Option B: File-based (persisted across restarts via volume mount)
# spring.datasource.url=jdbc:h2:file:/data/ingestiondb;DB_CLOSE_ON_EXIT=FALSE

# 2. Driver & Credentials
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. H2 Web Console (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# CRITICAL for Docker: allows accessing the console from your host browser
spring.h2.console.settings.web-allow-others=true